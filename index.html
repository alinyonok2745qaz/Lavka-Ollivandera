<!DOCTYPE html>

    <title>Подбор Волшебной Палочки | Хогвартс</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gold: {
                            100: '#FFF7D6',
                            300: '#FCE181',
                            400: '#F3C043',
                            500: '#D4AF37',
                            600: '#AA820A',
                            800: '#634B03',
                        },
                        magic: {
                            dark: '#080612',
                            card: '#131124',
                            border: '#2a244d',
                            accent: '#634488'
                        }
                    },
                    fontFamily: {
                        cinzel: ['Cinzel', 'serif'],
                        script: ['Pinyon Script', 'cursive'],
                        body: ['Marcellus', 'serif']
                    }
                }
            }
        }

    <style>
        body {
            background-color: #080612;
            color: #e2d8f0;
            font-family: 'Marcellus', serif;
            background-image: 
                radial-gradient(circle at 50% 15%, rgba(99, 68, 136, 0.3) 0%, transparent 60%),
                radial-gradient(circle at 80% 85%, rgba(212, 175, 55, 0.12) 0%, transparent 50%);
            background-attachment: fixed;
            min-height: 100vh;
        }

        .gold-gradient-text {
            background: linear-gradient(135deg, #FFF7D6 0%, #D4AF37 50%, #AA820A 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .glow-box {
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.15), inset 0 0 15px rgba(212, 175, 55, 0.05);
        }

        .glow-btn {
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.25);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glow-btn:hover {
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.5);
            transform: translateY(-1px);
        }

        .option-btn {
            transition: all 0.25s ease;
            background: rgba(19, 17, 36, 0.85);
            border: 1px solid rgba(212, 175, 55, 0.25);
        }

        .option-btn:hover {
            border-color: #D4AF37;
            background: rgba(35, 29, 66, 0.95);
            transform: translateY(-2px);
        }

        .option-btn.selected {
            border-color: #FCE181;
            background: linear-gradient(135deg, rgba(99, 68, 136, 0.5) 0%, rgba(212, 175, 55, 0.25) 100%);
            box-shadow: 0 0 18px rgba(212, 175, 55, 0.35);
        }

        #bgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-6px) rotate(0.5deg); }
        }

        .animate-float {
            animation: float 6s ease-in-out infinite;
        }

        @keyframes pulseGlow {
            0%, 100% { opacity: 0.5; filter: drop-shadow(0 0 8px rgba(212,175,55,0.4)); }
            50% { opacity: 0.95; filter: drop-shadow(0 0 22px rgba(212,175,55,0.85)); }
        }

        .wand-glow {
            animation: pulseGlow 3.5s ease-in-out infinite;
        }
    </style>
</head>
<body class="flex flex-col min-h-screen relative overflow-x-hidden justify-between">

    <!-- Canvas background stars -->
    <canvas id="bgCanvas"></canvas>

    <!-- Header -->
    <header class="relative z-10 pt-8 pb-4 text-center px-4">
        <div class="inline-block mb-2">
            <i class="fa-solid fa-hat-wizard text-3xl sm:text-4xl text-gold-400"></i>
        </div>
        <h1 class="font-cinzel text-3xl sm:text-4xl md:text-5xl font-bold tracking-widest gold-gradient-text uppercase">
            Лавка Олливандера
        </h1>
        <p class="font-script text-xl sm:text-2xl text-gold-300 mt-1">Палочка сама выбирает волшебника...</p>
        <div class="w-32 h-0.5 bg-gradient-to-r from-transparent via-gold-500 to-transparent mx-auto mt-3"></div>
    </header>

    <!-- Main Container -->
    <main class="relative z-10 flex-grow flex items-center justify-center p-4 sm:p-6">
        <div class="w-full max-w-2xl">

            <!-- QUIZ CONTAINER -->
            <div id="quizContainer" class="bg-magic-card border border-gold-500/30 rounded-2xl p-6 sm:p-8 glow-box backdrop-blur-md relative">
                
                <!-- Progress Bar -->
                <div class="mb-6">
                    <div class="flex justify-between items-center text-xs font-cinzel text-gold-400 mb-2">
                        <span id="stepIndicator">Вопрос 1 из 5</span>
                        <span id="progressPercent">20%</span>
                    </div>
                    <div class="w-full bg-magic-dark h-2 rounded-full overflow-hidden border border-gold-500/20">
                        <div id="progressBar" class="h-full bg-gradient-to-r from-gold-600 to-gold-400 w-1/5 transition-all duration-500"></div>
                    </div>
                </div>

                <!-- Question Title -->
                <h2 id="questionText" class="font-cinzel text-xl sm:text-2xl text-gold-100 text-center mb-8 font-semibold leading-relaxed">
                    <!-- Dynamic Question -->
                </h2>

                <!-- Options / Inputs Area -->
                <div id="optionsContainer" class="space-y-3 sm:space-y-4 mb-8">
                    <!-- Dynamic Options -->
                </div>

                <!-- Error Message Banner -->
                <div id="errorMessage" class="hidden mb-4 p-3 bg-red-950/80 border border-red-500/50 rounded-lg text-red-200 text-sm text-center font-body">
                    Пожалуйста, ответьте на вопрос перед тем как продолжить.
                </div>

                <!-- Navigation Buttons -->
                <div class="flex justify-between items-center pt-4 border-t border-gold-500/10">
                    <button id="prevBtn" onclick="prevQuestion()" class="px-5 py-2.5 rounded-xl border border-gold-500/30 text-gold-300 hover:text-gold-100 font-cinzel text-sm transition-all duration-300 disabled:opacity-30 disabled:cursor-not-allowed">
                        <i class="fa-solid fa-chevron-left mr-2"></i> Назад
                    </button>
                    <button id="nextBtn" onclick="nextQuestion()" class="px-6 py-2.5 rounded-xl bg-gradient-to-r from-gold-600 to-gold-500 hover:from-gold-500 hover:to-gold-400 text-magic-dark font-cinzel font-bold text-sm tracking-wider glow-btn transition-all duration-300">
                        Далее <i class="fa-solid fa-chevron-right ml-2"></i>
                    </button>
                </div>
            </div>

            <!-- RESULT CONTAINER -->
            <div id="resultContainer" class="bg-magic-card border border-gold-500/40 rounded-2xl p-6 sm:p-10 glow-box backdrop-blur-md text-center relative hidden animate-float">
                <div class="inline-block p-3 rounded-full bg-gold-500/10 border border-gold-500/30 mb-4">
                    <i class="fa-solid fa-wand-magic-sparkles text-3xl text-gold-400"></i>
                </div>
                
                <span class="block font-script text-2xl text-gold-300">Судьба свершилась</span>
                <h2 class="font-cinzel text-2xl sm:text-3xl text-gold-100 font-bold mb-2">Ваша Волшебная Палочка</h2>
                
                <div class="w-24 h-0.5 bg-gradient-to-r from-transparent via-gold-500 to-transparent mx-auto mb-6"></div>

                <!-- SVG Wand Representation -->
                <div class="my-6 py-6 px-4 bg-magic-dark/60 rounded-xl border border-gold-500/20 relative overflow-hidden flex flex-col items-center justify-center">
                    <div id="wandSvgContainer" class="w-full max-w-md h-24 flex items-center justify-center wand-glow">

                    </div>

                    <p id="wandSummary" class="font-cinzel text-lg sm:text-xl font-bold text-gold-300 mt-4 tracking-wide">
                        <!-- e.g. Вяз, волос единорога, гибкая, 12″ -->
                    </p>
                </div>

                        </div>
                        <p id="woodDesc" class="text-sm sm:text-base text-gray-300 leading-relaxed font-body">

                    </div>

                    <button onclick="retakeQuiz()" class="w-full sm:w-auto px-8 py-3.5 rounded-xl bg-gradient-to-r from-gold-600 to-gold-500 hover:from-gold-500 hover:to-gold-400 text-magic-dark font-cinzel font-bold text-base tracking-wider glow-btn transition-all duration-300">
                        <i class="fa-solid fa-rotate-right mr-2"></i> Пройти тест заново
                    </button>
                </div>
            </div>

        </div>
    </main>

                type: "single",
                options: [
                    { label: "К власти и признанию", val: "A" },
                    { label: "К знаниям и мудрости", val: "Б" },
                    { label: "К гармонии и покою", val: "В" },
                    { label: "К справедливости и защите", val: "Г" },
                    { label: "К свободе и приключениям", val: "Д" }
                ]
            },
            {
                id: 5,
                title: "Какая магия вам ближе?",
                type: "single",
                options: [
                    { label: "Светлая", val: "A" },
                    { label: "Тёмная", val: "Б" },
                    { label: "Нейтральная", val: "В" }
                ]
            }
        ];

        // --- STATE MANAGEMENT --- //
        let currentStep = 0;
        let answers = {
            q1: null,
            q2: null,
            q3: "",
            q4: null,
            q5: null
        };

        const STORAGE_KEY = "hogwarts_wand_quiz_result";

        // --- INITIALIZATION --- //
        window.addEventListener("DOMContentLoaded", () => {
            initBackgroundStars();
            
            // Check if user has saved state
            const savedResult = localStorage.getItem(STORAGE_KEY);
            if (savedResult) {
                try {
                    const wandData = JSON.parse(savedResult);
                    displayResult(wandData);
                } catch (e) {
                    startQuiz();
                }
            } else {
                startQuiz();
            }
        });

        function startQuiz() {
            document.getElementById("quizContainer").classList.remove("hidden");
            document.getElementById("resultContainer").classList.add("hidden");
            renderQuestion();
        }

        // --- RENDER QUESTION --- //
        function renderQuestion() {
            const q = QUESTIONS[currentStep];
            
            // Progress Bar & Step
            document.getElementById("stepIndicator").textContent = `Вопрос ${currentStep + 1} из ${QUESTIONS.length}`;
            document.getElementById("progressPercent").textContent = `${Math.round(((currentStep + 1) / QUESTIONS.length) * 100)}%`;
            document.getElementById("progressBar").style.width = `${((currentStep + 1) / QUESTIONS.length) * 100}%`;

            // Title
            let titleHtml = q.title;
            if (q.subtitle) {
                titleHtml += `<span class="block text-sm text-gold-300/80 font-normal mt-2">${q.subtitle}</span>`;
            }
            document.getElementById("questionText").innerHTML = titleHtml;

            // Clear Error
            hideError();

            // Options Container
            const container = document.getElementById("optionsContainer");
            container.innerHTML = "";

            if (q.type === "single") {
                const answerKey = `q${q.id}`;
                q.options.forEach((opt) => {
                    const btn = document.createElement("button");
                    btn.className = `option-btn w-full p-4 rounded-xl text-left font-body text-gold-100 flex items-center justify-between ${answers[answerKey] === opt.val ? 'selected' : ''}`;
                    
                    // Clean and concise option display without extra subtext
                    btn.innerHTML = `
                        <span class="text-base sm:text-lg font-medium">${opt.label}</span>
                        <div class="w-5 h-5 rounded-full border border-gold-500/40 flex items-center justify-center text-xs text-gold-300">
                            ${answers[answerKey] === opt.val ? '<i class="fa-solid fa-check"></i>' : ''}
                        </div>
                    `;

                    btn.onclick = () => {
                        answers[answerKey] = opt.val;
                        hideError();
                        renderQuestion();
                    };

                    container.appendChild(btn);
                });
            } else if (q.type === "text") {
                const wrapper = document.createElement("div");
                wrapper.className = "space-y-3";

                const input = document.createElement("textarea");
                input.rows = 3;
                input.className = "w-full p-4 rounded-xl bg-magic-dark/80 border border-gold-500/40 text-gold-100 placeholder-gold-500/30 focus:border-gold-400 focus:outline-none focus:ring-1 focus:ring-gold-400 font-body text-base";
                input.placeholder = q.placeholder;
                input.value = answers.q3;

                input.oninput = (e) => {
                    answers.q3 = e.target.value;
                    hideError();
                };

                wrapper.appendChild(input);
                container.appendChild(wrapper);
            }

            // Buttons
            document.getElementById("prevBtn").disabled = currentStep === 0;
            const nextBtn = document.getElementById("nextBtn");
            if (currentStep === QUESTIONS.length - 1) {
                nextBtn.innerHTML = `Узнать результат <i class="fa-solid fa-wand-magic-sparkles ml-2"></i>`;
            } else {
                nextBtn.innerHTML = `Далее <i class="fa-solid fa-chevron-right ml-2"></i>`;
            }
        }

        // --- NAVIGATION --- //
        function nextQuestion() {
            const q = QUESTIONS[currentStep];
            const answerKey = `q${q.id}`;

            // Validation
            if (q.type === "single" && !answers[answerKey]) {
                showError("Пожалуйста, выберите один из вариантов ответа.");
                return;
            }
            if (q.type === "text" && (!answers.q3 || answers.q3.trim().length < 2)) {
                showError("Пожалуйста, введите ваш ответ.");
                return;
            }

            if (currentStep < QUESTIONS.length - 1) {
                currentStep++;
                renderQuestion();
            } else {
                calculateAndSaveResult();
            }
        }

        function prevQuestion() {
            if (currentStep > 0) {
                currentStep--;
                renderQuestion();
            }
        }

        function showError(msg) {
            const err = document.getElementById("errorMessage");
            err.textContent = msg;
            err.classList.remove("hidden");
        }

        function hideError() {
            document.getElementById("errorMessage").classList.add("hidden");
        }

        // --- CALCULATION LOGIC MATCHING 30 CASES --- //
        function calculateAndSaveResult() {
            let caseIndex = 0;

            // Direct mapping for key response patterns
            if (answers.q1 === "A" && answers.q2 === "Б" && answers.q4 === "A" && answers.q5 === "В") {
                caseIndex = 0; // Case 1: Вяз, волос единорога, гибкая, 12″
            } else if (answers.q1 === "Б" && answers.q2 === "A" && answers.q4 === "Б" && answers.q5 === "В") {
                caseIndex = 1; // Case 2: Дуб, жила дракона, жёсткая, 11½″
            } else if (answers.q1 === "A" && answers.q2 === "A" && answers.q4 === "A" && answers.q5 === "Б") {
                caseIndex = 2; // Case 3: Красное дерево, рог василиска, жёсткая, 12½″
            } else if (answers.q1 === "A" && answers.q2 === "A" && answers.q4 === "Г" && answers.q5 === "Б") {
                caseIndex = 3; // Case 4: Тёрн, жила дракона
            } else if (answers.q1 === "Г" && answers.q2 === "В" && answers.q4 === "В" && answers.q5 === "A") {
                caseIndex = 6; // Case 7: Ива, волос единорога, гибкая, 9½″
            } else if (answers.q1 === "В" && answers.q2 === "Д" && answers.q4 === "Б" && answers.q5 === "A") {
                caseIndex = 15; // Case 16: Бук, сердце русала
            } else if (answers.q1 === "Е" && answers.q2 === "Д" && answers.q4 === "Д" && answers.q5 === "A") {
                caseIndex = 9; // Case 10: Явор, перо феникса
            } else {
                // Algorithmic hashing into the 30 case matrix
                const q1Code = (answers.q1 || "A").charCodeAt(0);
                const q2Code = (answers.q2 || "A").charCodeAt(0);
                const q4Code = (answers.q4 || "A").charCodeAt(0);
                const q5Code = (answers.q5 || "A").charCodeAt(0);
                const textLen = (answers.q3 || "").length;

                const score = (q1Code * 5 + q2Code * 3 + q4Code * 7 + q5Code * 11 + textLen * 13) % 30;
                caseIndex = score;
            }

            const chosenWand = CASE_MATRIX[caseIndex];

            const wandData = {
                wood: chosenWand.w,
                core: chosenWand.c,
                flexibility: chosenWand.f,
                length: chosenWand.l,
                woodDesc: WOOD_DESCRIPTIONS[chosenWand.w] || WOOD_DESCRIPTIONS["Английский дуб"],
                coreDesc: CORE_DESCRIPTIONS[chosenWand.c] || CORE_DESCRIPTIONS["жила дракона"]
            };

            // Save result
            localStorage.setItem(STORAGE_KEY, JSON.stringify(wandData));

            displayResult(wandData);
        }

        // --- DISPLAY RESULT --- //
        function displayResult(wand) {
            document.getElementById("quizContainer").classList.add("hidden");
            const resContainer = document.getElementById("resultContainer");
            resContainer.classList.remove("hidden");

            // Format Summary String: [Wood], [Core], [Flexibility], [Length]
            const summaryStr = `${wand.wood}, ${wand.core}, ${wand.flexibility}, ${wand.length}`;
            document.getElementById("wandSummary").textContent = summaryStr;

            // Wood details
            document.getElementById("woodTitle").textContent = `Древесина: ${wand.wood}`;
            document.getElementById("woodDesc").textContent = wand.woodDesc;

            // Core details
            document.getElementById("coreTitle").textContent = `Сердцевина: ${wand.core.charAt(0).toUpperCase() + wand.core.slice(1)}`;
            document.getElementById("coreDesc").textContent = wand.coreDesc;

            // Extra details
            document.getElementById("flexibilityValue").textContent = wand.flexibility;
            document.getElementById("lengthValue").textContent = wand.length;

            // Render SVG Wand
            renderWandSvg(wand.wood);
        }

        // --- RETAKE QUIZ --- //
        function retakeQuiz() {
            localStorage.removeItem(STORAGE_KEY);
            currentStep = 0;
            answers = { q1: null, q2: null, q3: "", q4: null, q5: null };
            document.getElementById("resultContainer").classList.add("hidden");
            document.getElementById("quizContainer").classList.remove("hidden");
            renderQuestion();
        }

        // --- DYNAMIC SVG WAND GENERATOR --- //
        function renderWandSvg(woodName) {
            const container = document.getElementById("wandSvgContainer");
            
            let woodColor = "#8B4513";
            let handleColor = "#4A2511";
            let accentColor = "#D4AF37";

            if (woodName.includes("Чёрное") || woodName.includes("Тёрн")) {
                woodColor = "#222222";
                handleColor = "#111111";
                accentColor = "#C0C0C0";
            } else if (woodName.includes("Красное") || woodName.includes("Виноградная")) {
                woodColor = "#7A1C1C";
                handleColor = "#420D0D";
            } else if (woodName.includes("Ива") || woodName.includes("Груша") || woodName.includes("Липа")) {
                woodColor = "#C4A482";
                handleColor = "#8B7355";
            } else if (woodName.includes("Дуб") || woodName.includes("Бук")) {
                woodColor = "#965228";
                handleColor = "#522B12";
            }

            container.innerHTML = `
                <svg width="100%" height="60" viewBox="0 0 400 60" fill="none" xmlns="http://www.w3.org/2000/svg" class="filter drop-shadow-[0_0_10px_rgba(212,175,55,0.6)]">
                    <!-- Glow effect -->
                    <path d="M 20 30 L 380 30" stroke="#FCE181" stroke-width="6" stroke-linecap="round" opacity="0.15" />
                    
                    <!-- Handle -->
                    <path d="M 30 30 L 110 30" stroke="${handleColor}" stroke-width="12" stroke-linecap="round" />
                    <circle cx="35" cy="30" r="7" fill="${accentColor}" />
                    <circle cx="110" cy="30" r="6" fill="${accentColor}" />
                    <path d="M 55 25 L 55 35 M 75 25 L 75 35 M 95 25 L 95 35" stroke="${accentColor}" stroke-width="2" opacity="0.6" />

                    <!-- Shaft -->
                    <path d="M 110 30 L 370 30" stroke="${woodColor}" stroke-width="7" stroke-linecap="round" />
                    
                    <!-- Tip Sparkle -->
                    <circle cx="370" cy="30" r="4" fill="#FFF7D6" />
                    <path d="M 370 20 L 370 40 M 360 30 L 380 30" stroke="#FFF7D6" stroke-width="1.5" />
                </svg>
            `;
        }

        // --- BACKGROUND CANVAS ANIMATION --- //
        function initBackgroundStars() {
            const canvas = document.getElementById("bgCanvas");
            const ctx = canvas.getContext("2d");

            let width = (canvas.width = window.innerWidth);
            let height = (canvas.height = window.innerHeight);

            window.addEventListener("resize", () => {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            });

            const stars = Array.from({ length: 70 }, () => ({
                x: Math.random() * width,
                y: Math.random() * height,
                size: Math.random() * 2 + 0.5,
                alpha: Math.random(),
                speed: Math.random() * 0.02 + 0.005
            }));

            function animate() {
                ctx.clearRect(0, 0, width, height);

                stars.forEach((star) => {
                    star.alpha += star.speed;
                    if (star.alpha > 1 || star.alpha < 0) {
                        star.speed = -star.speed;
                    }

                    ctx.fillStyle = `rgba(252, 225, 129, ${Math.abs(star.alpha) * 0.7})`;
                    ctx.beginPath();
                    ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                    ctx.fill();
                });

                requestAnimationFrame(animate);
            }

            animate();
        }
    </script>
</body>
